[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-framework-spraay"
version = "0.1.0"
description = "Crypto payroll agent for Microsoft Agent Framework using Spraay Protocol Gateway"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Plagtech" },
]
keywords = ["agent-framework", "spraay", "crypto", "payroll", "base", "batch-payments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "agent-framework>=0.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.urls]
Homepage = "https://github.com/plagtech/agent-framework-spraay"
Repository = "https://github.com/plagtech/agent-framework-spraay"
Issues = "https://github.com/plagtech/agent-framework-spraay/issues"

[tool.hatch.build.targets.wheel]
packages = ["crypto_payroll_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
